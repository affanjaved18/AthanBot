name: Build desktop releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm test
      - run: brew install ffmpeg
      - run: ./scripts/build_macos_app.sh
      - name: Verify disk image and bundled executables
        run: |
          hdiutil verify "dist/AthanBot-$ARCH.dmg"
          codesign --verify --deep --strict dist/AthanBot.app
          dist/AthanBot.app/Contents/MacOS/athanbot-node dist/AthanBot.app/Contents/Resources/src/main.js --help
          ffmpeg -v error -i dist/AthanBot.app/Contents/Resources/audio/malmo-fajr.opus.m4a -t 1 "$RUNNER_TEMP/athan-test.wav"
          dist/AthanBot.app/Contents/MacOS/athanbot-audio validate "$RUNNER_TEMP/athan-test.wav"
        env:
          ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm test
      - run: ./scripts/build_desktop_package.sh linux "$ARCH"
        env:
          ARCH: ${{ matrix.arch }}
      - name: Install and verify the package
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb
          athanbot --help
          test -f /usr/share/applications/athanbot.desktop
          mpv --no-config --no-video --ao=null --length=1 /usr/lib/athanbot/audio/malmo-fajr.opus
          sudo apt-get remove -y athanbot
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  windows-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: |
          ./scripts/build_desktop_package.sh windows x64
          ./scripts/build_desktop_package.sh windows arm64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/*.exe
          if-no-files-found: error

  windows-test:
    needs: windows-build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
      - run: npm test
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: installers
      - name: Install and verify AthanBot
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $installer = Get-Item "installers/*-windows-$env:ARCH.exe"
          $process = Start-Process $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installation failed" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\AthanBot'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'AthanBot.lnk'
          if (!(Test-Path $shortcut)) { throw "Start menu shortcut is missing" }
          & "$app\node.exe" "$app\src\main.js" --help
          if ($LASTEXITCODE -ne 0) { throw "Bundled application failed" }
          if ((& "$app\node.exe" -p 'process.arch') -ne $env:ARCH) { throw "Incorrect Node architecture" }
          $process = Start-Process "$app\Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path $shortcut)) { throw "Uninstallation failed" }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(node -p 'require("./package.json").version')"
          cd release
          sha256sum -- *.dmg *.deb *.exe > SHA256SUMS.txt
          gh release create "$TAG" --verify-tag --generate-notes *.dmg *.deb *.exe SHA256SUMS.txt
